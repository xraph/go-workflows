# Copy to .github/workflows/ci.yml in a Go library repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required: a called workflow can only narrow the caller's token, never widen
# it. Without security-events: write the gosec SARIF upload fails.
permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: xraph/workflows/.github/workflows/go-ci.yml@v1
    with:
      # Match your go.mod directive. Older versions than it will not build.
      go-versions: '["1.24","1.25","1.26"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
