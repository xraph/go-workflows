# Copy to .github/workflows/codeql.yml in a Go repository.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

# Required: a called workflow can only narrow the caller's token permissions,
# never widen them. Without this, CodeQL fails at startup.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: xraph/workflows/.github/workflows/codeql.yml@v1
    with:
      go-version: '1.26'
