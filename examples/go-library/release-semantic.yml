# Copy to .github/workflows/release.yml in a Go library repository that
# releases automatically from conventional commits.
#
# Releases are gated on CI passing: a tagged version is something downstream
# consumers pin, so releasing off a red build is worse than releasing late.
name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Required: a called workflow can only narrow the caller's token, never widen it.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Two merges inside one CI cycle would otherwise start two release runs. Both
# compute the same next version, and the second's CHANGELOG push is rejected
# non-fast-forward after the first already tagged.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # Never release off a red build.
    #
    # `branches:` above matches the TRIGGERING run's head_branch, and a fork's
    # default branch is also `main` — so a green CI run on someone's fork would
    # otherwise fire this release. The event and repository checks close that.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: xraph/workflows/.github/workflows/semantic-release.yml@v1
    with:
      warm-go-proxy: true
