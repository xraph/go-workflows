name: Semantic Release

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version. Must be 22+ for the pinned plugin set.'
        type: string
        default: '22'
      semantic-release-version:
        type: string
        default: '25'
      extra-plugins:
        description: 'JSON array of extra npm specs, e.g. ["@semantic-release/exec@7"]'
        type: string
        default: '[]'
      dry-run:
        description: 'Compute the next release without publishing anything.'
        type: boolean
        default: false
      warm-go-proxy:
        description: 'After a release, prime proxy.golang.org for this module.'
        type: boolean
        default: false
    outputs:
      version:
        description: 'Released version without a leading v. Also populated on a dry run; gate on `released`, not on this being non-empty.'
        value: ${{ jobs.release.outputs.version }}
      released:
        description: 'true when a release was published.'
        value: ${{ jobs.release.outputs.released }}

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
      released: ${{ steps.semrel.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Drop local tags before semantic-release refetches them
        shell: bash
        run: |
          set -euo pipefail
          # semantic-release runs `git fetch --tags` without --force. If any tag
          # moved since checkout wrote it, git refuses:
          #
          #   ! [rejected] v1 -> v1 (would clobber existing tag)
          #
          # and semantic-release exits 1 before computing anything. A repository
          # publishing a moving major tag hits this every release — this one did.
          #
          # Deleting the local tags first means that fetch has nothing to
          # clobber and repopulates them from the remote. It cannot lose data:
          # the workspace is ephemeral and the tags live on the remote. Doing it
          # here rather than fetching with --force keeps the checkout's
          # persist-credentials: false intact — semantic-release brings its own
          # authenticated remote.
          if [ -n "$(git tag -l)" ]; then
            git tag -l | xargs git tag -d >/dev/null
            echo "Dropped local tags; semantic-release will refetch them."
          fi

      - name: Check the verified commit is still the branch tip
        id: freshness
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # On workflow_run, GITHUB_SHA is the default branch's tip, NOT the commit whose
          # CI just passed. If another merge landed in between, releasing here would tag a
          # tree that CI never verified. Defer to the newer commit's own CI run instead.
          if [ "$EVENT_NAME" != 'workflow_run' ] || [ -z "${VERIFIED_SHA:-}" ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$VERIFIED_SHA" = "$HEAD_SHA" ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            {
              echo "### Release deferred"
              echo "CI verified \`${VERIFIED_SHA}\` but the branch tip is now \`${HEAD_SHA}\`."
              echo "A newer commit landed; its own CI run will release. Nothing was tagged."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.freshness.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install semantic-release
        if: steps.freshness.outputs.proceed == 'true'
        shell: bash
        env:
          SEMREL_VERSION: ${{ inputs.semantic-release-version }}
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
        run: |
          set -euo pipefail
          BASE="semantic-release@${SEMREL_VERSION}"
          BASE="$BASE @semantic-release/changelog@7"
          BASE="$BASE @semantic-release/git@11"
          BASE="$BASE @semantic-release/github@12"
          # Pinned to 9, NOT 10. Preset 10 targets the next conventional-changelog-writer
          # generation; semantic-release@25 uses release-notes-generator@14 -> writer@8.
          # With preset 10 the writerOpts shape does not match and the writer silently
          # emits only the version header, discarding every section. That shipped once:
          # xraph/confy v1.0.0 has a 22-byte CHANGELOG despite 3 feat: and 3 fix: commits.
          BASE="$BASE conventional-changelog-conventionalcommits@9"
          EXTRA=$(printf '%s' "$EXTRA_PLUGINS" | jq -r 'join(" ")')
          echo "Installing: $BASE $EXTRA"
          # npm package specs never contain spaces, so word splitting is intended here.
          # shellcheck disable=SC2086
          npm install -g -- $BASE $EXTRA

      - name: Run semantic-release
        id: semrel
        if: steps.freshness.outputs.proceed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = 'true' ]; then
            npx semantic-release --dry-run 2>&1 | tee semantic-release.log
          else
            npx semantic-release 2>&1 | tee semantic-release.log
          fi

          VERSION=""
          RELEASED=false
          # Version is scraped from the log. `tail -1` keeps this correct only because
          # semantic-release logs the success line last; a future plugin that logs after
          # `success` would break the assumption.
          if grep -qE 'Published release|Release note for version' semantic-release.log; then
            VERSION=$(grep -oE '(Published release|Release note for version) [0-9]+\.[0-9]+\.[0-9]+[-+.0-9A-Za-z]*' semantic-release.log \
              | tail -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[-+.0-9A-Za-z]*')
            if [ "$DRY_RUN" != 'true' ]; then
              RELEASED=true
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          {
            echo "### Semantic release"
            if [ -n "$VERSION" ]; then
              echo "- next version: \`$VERSION\`"
            else
              echo "- no release warranted by the commits in range"
            fi
            echo "- dry run: \`$DRY_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert release notes are not empty
        if: inputs.dry-run && steps.semrel.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          # Regression test for the conventional-changelog preset incompatibility that
          # shipped a 22-byte CHANGELOG to xraph/confy. A version was computed, so the
          # notes must contain at least one section heading. Exiting 0 when no version
          # was computed is handled by the step's `if:` — nothing to assert in that case.
          if ! grep -q '^###' semantic-release.log; then
            echo "A version was computed but the generated notes contain no '###' section."
            echo "This is the signature of a conventional-changelog preset/writer mismatch."
            echo "--- captured notes ---"
            sed -n '/Release note for version/,$p' semantic-release.log | head -40
            exit 1
          fi
          echo "- notes contain section headings: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Warm the Go module proxy
        if: inputs.warm-go-proxy && steps.semrel.outputs.released == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          set -euo pipefail
          curl -sSf "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/v${VERSION}.info" || true
