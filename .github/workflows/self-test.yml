name: Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required: a called workflow can only narrow the caller's token, never widen
# it. GitHub validates every nested job's permissions against this block at
# parse time, even jobs skipped at runtime via `if:` — so every job below
# that calls go-ci.yml needs security-events: write, not just the one
# smoke job that actually exercises the security job.
permissions:
  contents: read
  security-events: write

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint -color

  fixtures:
    name: Fixtures build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fixture: [fixture-lib, fixture-partial-make, fixture-nodeps]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: testdata/${{ matrix.fixture }}/go.mod

      - name: Test fixture
        working-directory: testdata/${{ matrix.fixture }}
        run: go test ./...

  smoke-fallback:
    name: Smoke — no Makefile
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: testdata/fixture-lib
      go-versions: '["1.26"]'
      os: '["ubuntu-latest","windows-latest"]'
      coverage: true
      skip-security: false

  smoke-partial-make:
    name: Smoke — Makefile without test-coverage
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: testdata/fixture-partial-make
      go-versions: '["1.26"]'
      os: '["ubuntu-latest"]'
      coverage: true
      skip-security: true

  smoke-nodeps:
    name: Smoke — no dependencies (no go.sum)
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: testdata/fixture-nodeps
      go-versions: '["1.26"]'
      os: '["ubuntu-latest"]'
      skip-security: true

  smoke-semantic-release:
    name: Smoke — semantic-release dry run
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry-run: true
