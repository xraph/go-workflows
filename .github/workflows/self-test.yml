name: Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint -color

  fixtures:
    name: Fixtures build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fixture: [fixture-lib, fixture-partial-make, fixture-nodeps]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: testdata/${{ matrix.fixture }}/go.mod

      - name: Test fixture
        working-directory: testdata/${{ matrix.fixture }}
        run: go test ./...

  smoke-fallback:
    name: Smoke — no Makefile
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: testdata/fixture-lib
      go-versions: '["1.26"]'
      os: '["ubuntu-latest","windows-latest"]'
      coverage: true
      skip-security: true

  smoke-partial-make:
    name: Smoke — Makefile without test-coverage
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: testdata/fixture-partial-make
      go-versions: '["1.26"]'
      os: '["ubuntu-latest"]'
      coverage: true
      skip-security: true

  smoke-nodeps:
    name: Smoke — no dependencies (no go.sum)
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: testdata/fixture-nodeps
      go-versions: '["1.26"]'
      os: '["ubuntu-latest"]'
      skip-security: true
